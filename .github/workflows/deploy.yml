# CD: push в main → тесты → сборка Docker-образа → публикация в GHCR → деплой на VPS по SSH (пароль).
#
# Обязательные секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      — IP или домен сервера
#   DEPLOY_USER      — SSH-пользователь (обычно root)
#   DEPLOY_PASSWORD  — SSH-пароль этого пользователя
# Необязательные:
#   DEPLOY_PORT      — SSH-порт (по умолчанию 22)
#   DEPLOY_PATH      — каталог на сервере (по умолчанию /opt/lab-hub)
#   DEPLOY_HTTP_PORT  — хостовый порт сайта вместо 80 (если 80 занят)
#   DEPLOY_HTTPS_PORT — хостовый порт вместо 443 (если 443 занят)
#   GHCR_USER        — логин GitHub для docker login (нужен, только если пакет в GHCR приватный)
#   GHCR_PAT         — PAT с read:packages (в паре с GHCR_USER)
#
# На сервере должен быть разрешён вход по паролю: в /etc/ssh/sshd_config —
#   PasswordAuthentication yes (после правки: systemctl restart ssh)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # ручной запуск из вкладки Actions

# Два деплоя одновременно не катаим; новый ждёт окончания текущего (не отменяет — прод важнее скорости)
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тесты (markdown, vault, graph, e2e)
        run: npm test

  build:
    name: Образ → GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа (GHCR принимает только lowercase)
        id: img
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: main (стабильный для compose) + sha-xxxxxxx (для отката и аудита)
      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production   # если настроено — даст кнопку подтверждения и URL в интерфейсе
    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_LOGIN: ${{ secrets.DEPLOY_USER }}
          PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$HOST" ] && MISSING="$MISSING DEPLOY_HOST"
          [ -z "$USER_LOGIN" ] && MISSING="$MISSING DEPLOY_USER"
          [ -z "$PASSWORD" ] && MISSING="$MISSING DEPLOY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Не заданы секреты:$MISSING (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "Секреты на месте: host=$HOST user=$USER_LOGIN"

      - name: Передать compose и скрипт деплоя
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.prod.yml,Caddyfile,scripts/ci-deploy-remote.sh,.env.example
          target: /tmp/lab-hub-deploy

      - name: Запустить деплой на сервере
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          envs: IMAGE,DEPLOY_PATH,GHCR_USER,GHCR_PAT,COMMIT_SHA,HTTP_PORT,HTTPS_PORT
          script: |
            # scp-action может положить файлы как с сохранением структуры, так и плоско —
            # ищем каждый файл и кладём в /tmp независимо от раскладки
            D=/tmp/lab-hub-deploy
            for f in docker-compose.prod.yml Caddyfile .env.example ci-deploy-remote.sh; do
              SRC="$D/$f"
              [ -f "$SRC" ] || SRC=$(find "$D" -type f -name "$f" | head -n1)
              if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
                echo "::error::Файл $f не найден в $D — scp не передал файлы"
                exit 1
              fi
              cp "$SRC" "/tmp/$f"
            done
            bash /tmp/ci-deploy-remote.sh
        env:
          IMAGE: ${{ needs.build.outputs.image }}:main
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/lab-hub' }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          COMMIT_SHA: ${{ github.sha }}
          HTTP_PORT: ${{ secrets.DEPLOY_HTTP_PORT || 80 }}
          HTTPS_PORT: ${{ secrets.DEPLOY_HTTPS_PORT || 443 }}

      - name: Проверить сайт снаружи
        env:
          HTTP_PORT: ${{ secrets.DEPLOY_HTTP_PORT || 80 }}
        run: |
          SUFFIX=""
          if [ "$HTTP_PORT" != "80" ]; then SUFFIX=":$HTTP_PORT"; fi
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${{ secrets.DEPLOY_HOST }}$SUFFIX/api/site" || true)
            if [ "$CODE" = "200" ]; then echo "Сайт отвечает 200"; exit 0; fi
            echo "Попытка $i: код $CODE, ждём 5 с…"; sleep 5
          done
          echo "::error::Сайт не ответил 200 после деплоя (http://${{ secrets.DEPLOY_HOST }}$SUFFIX/api/site)"
          exit 1
