# CI: тесты на каждый push и pull request.
# Зависимостей нет (ноль npm-пакетов), поэтому никакой установки — только node + тесты.
# e2e-тест сам поднимает сервер во временном DATA_DIR (порт 3997) и гасит его.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Тесты (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 — минимум из engines: node:sqlite доступен без флага именно с этой версии
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Проверка синтаксиса серверных модулей
        run: |
          find server scripts test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Тесты (markdown, vault, graph, e2e)
        run: npm test
