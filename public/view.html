<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--META-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/view.css">
<meta name="lh-accent" content="__ACCENT__">
<script src="/theme.js"></script>
</head>
<body>
<div id="app">
  <!-- Тулбар (тонкий, раздел 9.4) -->
  <header id="toolbar" class="toolbar">
    <div class="tb-group">
      <a class="tb-btn" id="btn-back" href="/" title="Назад к материалу" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
      </a>
      <button class="tb-btn" id="btn-sidebar" title="Миниатюры и оглавление" aria-label="Панель миниатюр">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <div class="tb-title" id="tb-title" title=""></div>
    <div class="tb-group">
      <div class="page-nav">
        <input id="page-input" type="text" inputmode="numeric" aria-label="Номер страницы" value="1">
        <span class="page-total" id="page-total">/ …</span>
      </div>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="btn-zoom-out" title="Уменьшить (−)" aria-label="Уменьшить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="tb-btn" id="btn-zoom-in" title="Увеличить (+)" aria-label="Увеличить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tb-btn wide" id="btn-fit" title="По ширине / по странице" aria-label="Вписать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      <button class="tb-btn wide" id="btn-rotate" title="Повернуть" aria-label="Повернуть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/><path d="M21 3v6h-6"/></svg></button>
      <div class="tb-sep"></div>
      <div class="mode-switch" role="group" aria-label="Режим отображения">
        <button id="mode-single" class="tb-btn wide active" title="Одна страница"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="1.5"/></svg></button>
        <button id="mode-scroll" class="tb-btn wide" title="Непрерывная прокрутка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="8" rx="1"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg></button>
        <button id="mode-spread" class="tb-btn wide" title="Разворот"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="9" height="14" rx="1"/><rect x="13" y="5" width="9" height="14" rx="1"/></svg></button>
      </div>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="btn-search" title="Поиск по тексту (Ctrl+F)" aria-label="Поиск"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
      <select id="theme-select" class="theme-select" title="Тема чтения" aria-label="Тема чтения">
        <option value="day">День</option>
        <option value="sepia">Сепия</option>
        <option value="night">Ночь</option>
      </select>
      <button class="tb-btn" id="btn-print" title="Печать" aria-label="Печать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
      <a class="tb-btn" id="btn-download" title="Скачать" aria-label="Скачать" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></a>
      <button class="tb-btn" id="btn-fullscreen" title="Полный экран (F)" aria-label="Полный экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    </div>
  </header>

  <!-- Панель поиска -->
  <div id="search-bar" class="search-bar hidden">
    <input id="search-input" type="text" placeholder="Найти в документе…" aria-label="Поиск по документу">
    <span id="search-count" class="search-count"></span>
    <button class="tb-btn" id="search-prev" aria-label="Предыдущее совпадение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m18 15-6-6-6 6"/></svg></button>
    <button class="tb-btn" id="search-next" aria-label="Следующее совпадение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="tb-btn" id="search-close" aria-label="Закрыть поиск"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>

  <div class="body">
    <!-- Левая выдвижная панель: миниатюры + оглавление (раздел 5) -->
    <aside id="sidebar" class="sidebar hidden">
      <div class="side-tabs">
        <button id="tab-thumbs" class="active">Миниатюры</button>
        <button id="tab-outline">Оглавление</button>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <div id="outline" class="outline hidden"></div>
    </aside>

    <main id="viewer" class="viewer" tabindex="0">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка документа…</div>
        <div class="load-progress"><div id="load-progress-bar"></div></div>
      </div>
      <div id="pages"></div>
      <div id="error" class="error hidden"></div>
    </main>
  </div>

  <!-- Индикатор прогресса чтения (раздел 5) -->
  <div class="progress-wrap"><div id="read-progress"></div></div>
</div>
<!-- Данные материала для читалки: JSON-блок (не исполняемый скрипт — CSP-безопасно) -->
<script type="application/json" id="boot-data">__BOOTSTRAP__</script>
<script type="module" src="/view.js"></script>
</body>
</html>
