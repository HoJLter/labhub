<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--META-->
<meta name="theme-color" content="#5b5bd6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<meta name="lh-accent" content="__ACCENT__">
<!-- Тема применяется до первой отрисовки (внешний скрипт — CSP запрещает инлайн) -->
<script src="/theme.js"></script>
</head>
<body>
<header class="header">
  <button class="icon-btn hamburger" id="btn-drawer" aria-label="Открыть меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="logo" href="/" data-link>
    <span class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </span>
    <span>__SITE_NAME__</span>
  </a>
  <div class="header-search" role="search">
    <span class="s-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </span>
    <input id="search-input" type="search" placeholder="Поиск по названию, описанию, тегам…" autocomplete="off" aria-label="Поиск">
    <span class="s-kbd"><span class="kbd">/</span></span>
    <div class="search-suggest" id="search-suggest" role="listbox"></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btn-theme" aria-label="Переключить тему">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icon-moon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Каталог">
    <div class="sidebar-title">Каталог</div>
    <input class="tree-filter" id="tree-filter" type="search" placeholder="Фильтр по папкам…" aria-label="Фильтр дерева папок">
    <div class="tree" id="folder-tree"></div>
    <div class="sidebar-foot">
      <a href="/privacy" data-link>Политика конфиденциальности</a>
      <span>Без сторонних трекеров. Статистика обезличена.</span>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="content" id="main" tabindex="-1">
    <div class="content-inner" id="view">
      <div class="skeleton sk-card" style="margin-bottom:14px"></div>
      <div class="skeleton sk-row"></div>
      <div class="skeleton sk-row"></div>
      <div class="skeleton sk-row"></div>
    </div>
  </main>
</div>

<footer class="footer">
  <span id="footer-note">__SITE_NAME__</span>
  <span class="spacer"></span>
  <a href="/admin">Админ-панель</a>
</footer>

<div id="toasts" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
