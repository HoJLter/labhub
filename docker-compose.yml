# Прод-развёртывание lab-hub: app + Caddy (TLS, gzip/brotli, security-заголовки) + nightly-бэкап.
# Запуск: docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - lab-hub-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/site').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    build: .
    restart: unless-stopped
    command: sh -c "while true; do sleep 86400; node scripts/backup.js; done"
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - lab-hub-data:/data

volumes:
  lab-hub-data:
  caddy-data:
  caddy-config:
